AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Sleeper Manager scheduled decision service

Parameters:
  SleeperLeagueId:
    Type: String
    NoEcho: true
  SleeperUserId:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 60
    Environment:
      Variables:
        SLEEPER_LEAGUE_ID: !Ref SleeperLeagueId
        SLEEPER_USER_ID: !Ref SleeperUserId
        STATE_BACKEND: dynamodb
        STATE_TABLE_NAME: !Ref StateTable
        TIMEZONE: Pacific/Honolulu

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ScheduledFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../src
      Handler: sleeper_manager.handlers.scheduled.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
      Events:
        Poll:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)
            FlexibleTimeWindow:
              Mode: OFF
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 300

Outputs:
  ScheduledFunctionArn:
    Value: !GetAtt ScheduledFunction.Arn
  StateTableName:
    Value: !Ref StateTable
