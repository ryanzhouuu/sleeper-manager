[decision]
preset = "balanced"
minimum_confidence = 0.70
# "win_chance" picks starters, locks, and passes by the chance of beating this week's
# opponent instead of expected points; without an opponent projection it uses points.
# objective = "points"

[notifications]
# Accepted and stored; quiet-hour suppression is not enforced yet.
quiet_hours_start = "23:00"
quiet_hours_end = "07:00"
urgent_actions_override_quiet_hours = true

[players]
mapping_overrides = {}

[projections]
active_provider = "direct_baseline"
# Required for hybrid advice; use a verified published history version.
# hybrid_history_version = "hybrid-runtime-v1-..."
