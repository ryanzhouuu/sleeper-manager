name = "sleeper-manager"
main = "src/worker.py"
compatibility_date = "2026-07-28"
compatibility_flags = ["python_workers"]

[limits]
cpu_ms = 300000

[[queues.producers]]
binding = "PLANNING_QUEUE"
queue = "sleeper-manager-planning"

[[queues.consumers]]
queue = "sleeper-manager-planning"
max_batch_size = 1
max_batch_timeout = 0
max_concurrency = 1
max_retries = 3
retry_delay = 60

[observability]
enabled = true
redact_query_string = true

[observability.traces]
enabled = true

[vars]
NTFY_BASE_URL = "https://ntfy.sh"
OPEN_SLEEPER_URL = "https://sleeper.com"
ACKNOWLEDGEMENT_BASE_URL = "https://sleeper-manager.ryanzhouuu.workers.dev/ack"

[secrets]
required = ["DISCORD_WEBHOOK_URL", "SLEEPER_LEAGUE_ID", "SLEEPER_USER_ID"]

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "sleeper_manager_state"
database_name = "sleeper-manager-state"
database_id = "ceabcb2a-68f6-4781-8c50-98f37a0e6044"
migrations_dir = "infra/cloudflare/migrations"

[[d1_databases]]
binding = "forecast_archive"
database_name = "sleeper-manager-forecast-archive"
database_id = "eb8dc241-3b18-4464-9498-9dd5f2ae758a"
migrations_dir = "infra/cloudflare/forecast-migrations"

[python_modules]
exclude = [
    "**/*.pyc",
    "**/__pycache__",
    "**/httpx/**",
    "**/httpx-*.dist-info/**",
    "**/pydantic_settings/**",
    "**/pydantic_settings-*.dist-info/**",
    "**/dotenv/**",
    "**/python_dotenv-*.dist-info/**",
]
